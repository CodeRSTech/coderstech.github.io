---
layout: main
---
<div class="row mt-4">
  <!-- Left Panel: Sticky Navigation (Hidden on Mobile) -->
  <div class="col-md-3 d-none d-md-block">
    <div class="sticky-top" style="top: 20px;">
      <h6 class="text-uppercase fw-bold text-primary mb-3">Quick Nav</h6>
      <nav class="nav flex-column border-start border-secondary ps-3">
        <!-- These hrefs must match the IDs in your markdown -->
        <a class="nav-link text-white-50 px-0 py-1" href="#overview">Overview</a>
        <a class="nav-link text-white-50 px-0 py-1" href="#diagnosis">The Diagnostic</a>
        <a class="nav-link text-white-50 px-0 py-1" href="#rebuild">The Rebuild</a>
      </nav>
      <a href="/logs" class="btn btn-sm btn-outline-secondary mt-4"><i class="bi bi-arrow-left me-1"></i>Back to Logs</a>
    </div>
  </div>

  <!-- Right Panel: Main Image-Heavy Content -->
  <div class="col-md-9 pb-5">
    <h1 class="text-light fw-bold mb-2">{{ page.title }}</h1>
    <span class="badge bg-primary mb-4">{{ page.category | capitalize }}</span>
    
    <div class="text-white-50">
      {{ content }}
    </div>
  </div>
</div>

<script>
  document.addEventListener("DOMContentLoaded", function() {
    // 1. Target the center column containing your markdown payload
    const contentArea = document.querySelector('.col-lg-8');
    // 2. Find all H3 headings generated by your Markdown
    const headings = contentArea.querySelectorAll('h3');
    // 3. Target both navigation ribbons
    const desktopToc = document.getElementById('toc-nav');
    const mobileToc = document.getElementById('toc-nav-mobile');

    headings.forEach(heading => {
      // Ensure the heading has an ID (Kramdown auto-generates these)
      if (!heading.id) return; 

      // Create the Desktop Link
      const desktopLink = document.createElement('a');
      desktopLink.className = 'nav-link text-white-50 px-2 py-1';
      desktopLink.href = '#' + heading.id;
      desktopLink.textContent = heading.textContent;
      desktopToc.appendChild(desktopLink);

      // Create the Mobile Link
      const mobileLink = document.createElement('a');
      mobileLink.className = 'nav-link text-white-50 text-nowrap py-1 px-2';
      mobileLink.href = '#' + heading.id;
      mobileLink.textContent = heading.textContent;
      mobileToc.appendChild(mobileLink);
    });
  });
</script>
