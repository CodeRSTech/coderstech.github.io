<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page.title }}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <style>
    /* Prevents anchor links from hiding under your sticky global navbar */
    html { scroll-padding-top: 80px; }
  </style>
</head>
<!-- Native Scrollspy applied directly to the body -->
<body class="bg-dark text-light" data-bs-spy="scroll" data-bs-target="#toc-nav">
  {% include navbar.html %}
  <div class="container mt-5">
    {{ content }}
  </div>
  <!-- Essential Bootstrap Bundle for Mobile Toggler and Native Scrollspy -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
