<!DOCTYPE html>
<html lang="en">
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page.title }}</title>
  <!-- Inject Bootstrap for the Navbar -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Inject Lightbox CDN -->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/lightbox2/2.11.4/css/lightbox.min.css" rel="stylesheet">
  <style>
      /* Responsive CSS Masonry */
      .gallery-masonry { 
        column-count: 3; 
        column-gap: 15px; 
        padding: 20px;
      }
      .gallery-masonry a { 
        display: block; 
        margin-bottom: 15px; 
        break-inside: avoid; /* Prevents images from splitting across columns */
      }
      .gallery-masonry img { 
        width: 100%; 
        height: auto; 
        display: block; 
        border-radius: 4px;
        transition: transform 0.2s ease-in-out;
      }
      .gallery-masonry img:hover {
        transform: scale(1.02);
      }
      
      /* Mobile Breakpoints */
      @media (max-width: 991px) { .gallery-masonry { column-count: 2; } }
      @media (max-width: 575px) { .gallery-masonry { column-count: 1; } }
    </style>
</head>
<body>
  {% include navbar.html %}
  <div class="gallery-masonry">
    {{ content }}
  </div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/lightbox2/2.11.4/js/lightbox-plus-jquery.min.js"></script>
  <!-- Inject Bootstrap JS for Mobile Toggler -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</body>
</html>
