<nav class="site-nav navbar" aria-label="Primary">
  <div class="nav-inner">
    <a class="navbar-brand" href="{{ '/' | relative_url }}">{{ site.data.navigation.brand }}</a>
    <button class="nav-toggle" type="button" aria-controls="primary-navigation" aria-expanded="false" aria-label="Toggle navigation">
      <span></span><span></span><span></span>
    </button>
    <div class="nav-menu" id="primary-navigation">
      <ul class="navbar-nav">
        {% for link in site.data.navigation.links %}
        <li class="nav-item">
          <a class="nav-link{% if link.title == 'Resume' %} nav-resume{% endif %}" href="{{ link.url | relative_url }}"{% if page.url == link.url %} aria-current="page"{% endif %}>{{ link.title }}</a>
        </li>
        {% endfor %}
      </ul>
    </div>
  </div>
</nav>
