<div class="py-5 border-bottom border-secondary">
  <h2 class="mb-4 text-light terminal-prompt">R&D Sectors</h2>
  <div class="row g-4">
    {% for sector in site.data.featured.sectors %}
    <div class="col-md-6">
      <a href="{{ sector.url }}" class="text-decoration-none">
        <div class="card bg-dark border-secondary p-4 h-100 hover-overlay">
          <h4 class="text-light mb-2">{{ sector.title }} <i class="bi bi-arrow-right ms-2"></i></h4>
          <p class="text-white-50 mb-0">{{ sector.description }}</p>
        </div>
      </a>
    </div>
    {% endfor %}
  </div>
</div>
