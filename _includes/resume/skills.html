<section class="resume-side-section resume-skills" aria-labelledby="resume-skills">
  <h2 id="resume-skills">{% include icon.html name="skills" %}Skills</h2>
  <div class="sidebar-skills-container">
    {% for skill in include.data %}
    {% if skill.name %}
    <div class="sidebar-skill-item">
      <div class="sidebar-skill-label">{{ skill.name }}</div>
      {% if skill.proficiency %}
      <div class="skill-progress-bar"><div class="skill-progress-fill" style="width: {{ skill.proficiency | times: 10 }}%;"></div></div>
      {% endif %}
    </div>
    {% else %}
    <div class="sidebar-skill-item">{{ skill | escape }}</div>
    {% endif %}
    {% endfor %}
  </div>
</section>
