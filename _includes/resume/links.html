<section class="resume-side-section resume-links" aria-labelledby="resume-links">
  <h2 id="resume-links">{% include icon.html name="links" %}Links</h2>
  <ul class="resume-links-list">
    {% for link in site.data.resume.links %}
    <li>
      {% assign link_url = link.url %}
      {% unless link.url contains '://' or link.url contains 'mailto:' %}
        {% assign link_url = link.url | relative_url %}
      {% endunless %}
      <a href="{{ link_url }}"{% if link.url contains '://' %} target="_blank" rel="noopener noreferrer"{% endif %}>{{ link.label }}</a>
    </li>
    {% endfor %}
  </ul>
</section>
