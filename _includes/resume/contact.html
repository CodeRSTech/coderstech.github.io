<section class="resume-side-section resume-contact" aria-labelledby="resume-contact">
  <h2 id="resume-contact">{% include icon.html name="contact" %}Contact</h2>
  <div class="resume-contact-list">
    <a class="resume-contact-item" href="mailto:{{ site.data.resume.contact.email }}">
      <span>{{ site.data.resume.contact.email }}</span>
    </a>
    <span class="resume-contact-item"><span>{{ site.data.resume.contact.location }}</span></span>
  </div>
</section>
