<div class="py-5 border-bottom border-secondary">
  <!-- 1. SEO & Accessibility Fallback -->
  <!-- We keep the original Jekyll data injection but visually hide it from the screen -->
  <h1 class="visually-hidden">{{ site.data.hero.name }}</h1>

  <!-- 2. WebGL Canvas Mount Point -->
  <!-- Replaces the original h1 class="display-4 fw-bold text-light terminal-prompt mb-3" -->
  <div id="neon-container" class="mb-3" style="width: 100%; height: 90px; overflow: hidden;"></div>

  <!-- 3. Preserved Jekyll Content -->
  <p class="lead text-white-50 mb-4" style="max-width: 800px;">
    {{ site.data.hero.tagline }}
  </p>
  <div class="d-flex gap-3">
    {% for btn in site.data.hero.buttons %}
      <a href="{{ btn.url }}" class="btn {{ btn.style }} px-4 py-2 fw-bold rounded-0">
        <i class="{{ btn.icon }} me-2"></i>{{ btn.text }}
      </a>
    {% endfor %}
  </div>
</div>

<!-- ========================================== -->
<!-- 4. DIRECT JAVASCRIPT EMBED                 -->
<!-- ========================================== -->

<!-- Import Map: Tells the browser where to download the WebGL packages -->
<script type="importmap">
  {
    "imports": {
      "pixi.js": "https://esm.sh/pixi.js@8",
      "pixi-filters": "https://esm.sh/pixi-filters@6"
    }
  }
</script>

<!-- The Render Engine -->
<script type="module">
  import { Application, Text } from 'pixi.js';
  import { AdvancedBloomFilter } from 'pixi-filters';

  async function initNeon() {
    const container = document.getElementById('neon-container');
    const app = new Application();

    // Initialize WebGL context to perfectly fit the designated div
    await app.init({
      backgroundAlpha: 0,
      resizeTo: container,
      antialias: true
    });

    container.appendChild(app.canvas);

    // Create the text graphic using Jekyll's Liquid templating directly in the JS
    const neonText = new Text({
      text: "{{ site.data.hero.name }}", // Jekyll renders this before shipping to the browser
      style: {
        fontFamily: 'system-ui, -apple-system, sans-serif',
        fontSize: 64, // Roughly equivalent to Bootstrap's display-4
        fill: 0xffffff,
        fontWeight: 'bold'
      }
    });

    // Left-align the WebGL text to match your original Bootstrap layout
    neonText.x = 0;
    neonText.y = app.screen.height / 2;
    neonText.anchor.set(0, 0.5);

    // Apply the hardware-accelerated bloom
    const neonGlow = new AdvancedBloomFilter({
      threshold: 0.1,
      bloomScale: 1.5,
      brightness: 1.2,
      blur: 15,
      quality: 4
    });

    neonText.filters = [neonGlow];
    app.stage.addChild(neonText);

    // The high-FPS animation loop
    let time = 0;
    app.ticker.add((ticker) => {
      time += ticker.deltaTime * 0.05;

      const isMacroBuzz = Math.random() > 0.98;

      if (isMacroBuzz) {
        neonText.alpha = 0.4;
        neonGlow.brightness = 0.2;
      } else {
        neonText.alpha = 0.95 + (Math.sin(time * 20) * 0.05);
        neonGlow.brightness = 1.0 + (Math.sin(time * 30) * 0.2);
      }
    });
  }

  initNeon();
</script>
