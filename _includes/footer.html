<footer class="site-footer">
  <div class="footer-inner">
    <p>&copy; {{ site.time | date: "%Y" }} R&amp;D LAB. All rights reserved.</p>
    <div class="footer-links">
      {% for social in site.data.profiles.socials %}
      <a href="{{ social.url }}" aria-label="Visit {{ social.name }}"{% if social.url contains 'http' %} target="_blank" rel="noopener noreferrer"{% endif %}>{{ social.name }}</a>
      {% endfor %}
    </div>
  </div>
</footer>
