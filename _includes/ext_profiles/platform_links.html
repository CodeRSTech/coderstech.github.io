    <!-- Platform Links span across horizontally now -->
    {% for platform in site.data.profiles.platforms %}
    <div class="col-lg-4 col-md-6">
      <a href="{{ platform.url }}" class="text-decoration-none"{% if platform.url contains 'http' %} target="_blank" rel="noopener noreferrer"{% endif %}>
        <div class="card bg-dark border-secondary p-3 hover-overlay transition-all d-flex flex-row align-items-center h-100">
          <i class="{{ platform.icon }} fs-2 me-3"></i>
          <div>
            <strong class="text-light d-block">{{ platform.name }}</strong>
            <small class="text-white-50 profile-platform-description">{{ platform.description }}</small>
          </div>
        </div>
      </a>
    </div>
    {% endfor %}

    <!-- Connect Block fills the remaining space -->
    <div class="col-lg-4 col-md-12">
      <div class="card bg-dark border-secondary p-3 h-100 d-flex flex-row align-items-center justify-content-between">
        <small class="text-white-50 text-uppercase fw-bold mb-0">Network</small>
        <div class="d-flex gap-2">
          {% for social in site.data.profiles.socials %}
            <a href="{{ social.url }}" aria-label="Visit my {{ social.icon | replace: 'bi bi-', '' }}" class="btn border border-secondary rounded-circle p-2 d-inline-flex align-items-center justify-content-center"{% if social.url contains 'http' %} target="_blank" rel="noopener noreferrer"{% endif %}>
              <i class="{{ social.icon }} text-light fs-5"></i>
            </a>
          {% endfor %}
        </div>
      </div>
    </div>
